<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MCP Event Explorer</title>
    <link rel="stylesheet" href="./css/bootstrap.min.css" />
    <link rel="stylesheet" href="./css/json-viewer.css" />
    <link rel="stylesheet" href="./css/fullscreen.css" />
  </head>
  <body>
    <div class="fs-shell">
      <header class="fs-header">
        <div class="fs-brand">
          <img src="./images/is_logo.png" alt="CloudKettle" />
          <div class="fs-brand-copy">
            <h1>MCP Event Explorer</h1>
            <p>Interaction Studio-style time-series view of captured events</p>
          </div>
        </div>
          <div class="fs-header-actions">
          <span class="fs-stat" id="fsTotalStat">0 events</span>
          <button class="fs-btn" id="BtnFsSdkTools" type="button">SDK Tools</button>
          <button class="fs-btn" id="BtnFsDownloadFiltered" type="button">
            Download Filtered
          </button>
          <button class="fs-btn" id="BtnFsRefresh" type="button">Refresh</button>
          <button class="fs-btn fs-btn-danger" id="BtnFsClear" type="button">
            Clear All
          </button>
        </div>
      </header>

      <nav class="fs-tabs" id="fsSiteTabs" aria-label="Captured sites"></nav>

      <section class="fs-toolbar">
        <div class="fs-filter-group">
          <label>Time range</label>
          <div class="fs-chip-row" id="fsTimeChips">
            <button class="fs-chip" type="button" data-range="15m">
              Last 15 min
            </button>
            <button class="fs-chip" type="button" data-range="1h">
              Last 1 hour
            </button>
            <button class="fs-chip active" type="button" data-range="24h">
              Last 24 hours
            </button>
            <button class="fs-chip" type="button" data-range="today">
              Today
            </button>
            <button class="fs-chip" type="button" data-range="7d">
              Last 7 days
            </button>
            <button class="fs-chip" type="button" data-range="all">All</button>
            <button class="fs-chip" type="button" data-range="custom">
              Custom
            </button>
          </div>
          <div class="fs-custom-range" id="fsCustomRange">
            <input type="datetime-local" id="fsFrom" />
            <input type="datetime-local" id="fsTo" />
          </div>
        </div>

        <div class="fs-filter-group fs-search">
          <label>Filter by action / URL</label>
          <input
            id="fsSearch"
            type="search"
            placeholder="e.g. Page View, Add To Cart, /checkout"
          />
        </div>

        <div class="fs-toolbar-meta">
          <div id="fsFilteredStat">Showing 0 events</div>
          <div class="fs-sort">
            <button class="fs-chip active" type="button" data-sort="desc">
              Newest first
            </button>
            <button class="fs-chip" type="button" data-sort="asc">
              Oldest first
            </button>
          </div>
        </div>
      </section>

      <main class="fs-main">
        <section class="fs-panel">
          <div class="fs-panel-header">
            <h2>Event stream</h2>
            <span id="fsStreamSubtitle">Select a site tab to begin</span>
          </div>
          <div class="fs-timeline" id="fsTimeline"></div>
        </section>

        <aside class="fs-panel fs-detail">
          <div class="fs-panel-header">
            <h2>Event details</h2>
            <div class="fs-detail-actions">
              <button class="fs-btn" id="BtnDownloadJson" type="button">
                Download JSON
              </button>
              <button class="fs-btn fs-btn-primary" id="BtnCopyJson" type="button">
                Copy JSON
              </button>
            </div>
          </div>
          <div class="fs-detail-body" id="fsDetailBody">
            <div class="fs-empty">
              <strong>No event selected</strong>
              Click an event in the stream to inspect its payload.
            </div>
          </div>
        </aside>
      </main>
    </div>

    <script src="./js/jquery-3.6.3.js"></script>
    <script src="./js/bootstrap.bundle.min.js"></script>
    <script src="./js/moment-with-locales.min.js"></script>
    <script src="./js/json-viewer.js"></script>
    <script src="./js/fullscreen.js"></script>
  </body>
</html>
